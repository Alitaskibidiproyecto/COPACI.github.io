<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - COPACI</title>
    <link rel="stylesheet" href="css/login_nuevo.css">
</head>
<body>

    <header>
        <h1>COPACI</h1>
        <p>Consejo de Participación Ciudadana</p>
    </header>

    <section id="bienvenida">
        <h2>Bienvenido</h2>
        <p>Accede a tu panel según tu rol: Administrador, COPACI o Ciudadano.</p>
    </section>

    <main>
        <section id="login">
            <h2>Iniciar Sesión</h2>

            <form id="formLogin">
                <label for="rol">Selecciona tu rol:</label>
                <select id="rol" required>
                    <option value="">-- Elige una opción --</option>
                    <option value="admin">Administrador</option>
                    <option value="copaci">COPACI</option>
                    <option value="ciudadano">Ciudadano</option>
                </select>

                <br><br>

                <label for="correoLogin">Correo electrónico:</label>
                <input type="email" id="correoLogin" placeholder="Tu correo registrado">

                <br><br>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Tu contraseña">

                <br><br>

                <button type="submit">Entrar</button>
                <button type="reset">Limpiar</button>
            </form>

            <p id="mensaje"></p>

            <p style="text-align: center; margin-top: 15px;">
                ¿No tienes cuenta? <a href="registro.html" style="color: #d4a017; font-weight: bold;">Regístrate aquí</a>
            </p>
        </section>
    </main>

    <footer>
        <p>COPACI - Consejo de Participación Ciudadana</p>
        <p>&copy; 2025</p>
    </footer>

    <script>
        document.getElementById("formLogin").addEventListener("submit", function(event) {
            event.preventDefault();

            const rolSeleccionado = document.getElementById("rol").value;
            const correo = document.getElementById("correoLogin").value.trim();
            const password = document.getElementById("password").value;
            const mensaje = document.getElementById("mensaje");

            if (rolSeleccionado === "") {
                mensaje.textContent = "⚠️ Debes seleccionar un rol.";
                return;
            }

            if (correo === "") {
                mensaje.textContent = "⚠️ Ingresa tu correo electrónico.";
                return;
            }

            // Buscar en localStorage
            let usuariosGuardados = localStorage.getItem("usuariosCOPACI");
            usuariosGuardados = usuariosGuardados ? JSON.parse(usuariosGuardados) : [];

            const usuarioEncontrado = usuariosGuardados.find(user => user.correo === correo);

            if (!usuarioEncontrado) {
                mensaje.textContent = "❌ El correo no está registrado.";
                return;
            }

            // Validar que el rol elegido sea el mismo con el que se registró
            if (usuarioEncontrado.rol !== rolSeleccionado) {
                mensaje.textContent = "❌ Este correo no pertenece al rol seleccionado.";
                return;
            }

            if (usuarioEncontrado.password !== password) {
                mensaje.textContent = "❌ Contraseña incorrecta.";
                return;
            }

            // Guardar sesión
            localStorage.setItem("usuarioActivo", JSON.stringify(usuarioEncontrado));
            mensaje.textContent = "✅ Bienvenido, " + usuarioEncontrado.nombre;

            // Redirigir al panel correcto
            if (rolSeleccionado === "ciudadano") {
                window.location.href = "ciudadano.html";
            } else if (rolSeleccionado === "copaci") {
                window.location.href = "copaciverdadero.html";
            } else if (rolSeleccionado === "admin") {
                window.location.href = "copaci.html";
            }
        });
    </script>

</body>
</html>
